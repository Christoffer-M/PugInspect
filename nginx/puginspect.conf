server {
    listen 80;
    listen [::]:80;
    server_name _;  # replace _ with your domain (e.g. puginspect.com)

    # Frontend static files
    root /home/chris/PugInspect/apps/frontend/dist;  # update path if different
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy GraphQL to PM2 backend on port 4000
    location /graphql {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
