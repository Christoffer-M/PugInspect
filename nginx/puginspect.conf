server {
    listen 80;
    listen [::]:80;
    server_name puginspect.com www.puginspect.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name puginspect.com www.puginspect.com;

    ssl_certificate /etc/nginx/ssl/puginspect.pem;
    ssl_certificate_key /etc/nginx/ssl/puginspect.key;

    # Frontend static files
    root /home/chris/PugInspect/apps/frontend/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend routes to PM2 on port 4000
    location /graphql {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /stats.js {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
