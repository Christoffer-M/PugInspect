map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Crawlers and link unfurlers that should get server-injected meta tags
map $http_user_agent $is_bot {
    default 0;
    ~*(googlebot|bingbot|yandexbot|duckduckbot|baiduspider|applebot|discordbot|twitterbot|facebookexternalhit|linkedinbot|slackbot|telegrambot|whatsapp|pinterestbot|redditbot|embedly|summalybot|mastodon|bluesky|skypeuripreview) 1;
}

upstream backend {
    server backend:4000;
}

server {
    listen 80;
    server_name _; # catchall — accepts any hostname in container context

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.puginspect.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src * data:; connect-src 'self' https://stats.puginspect.com; frame-ancestors 'none';" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Character pages: bots get index.html with per-character meta tags
    # injected by the backend; everyone else gets the static SPA.
    location ~ "^/(us|eu|kr|tw|cn)/[^/]+/[^/]+/?$" {
        if ($is_bot) {
            rewrite ^/(.*)$ /meta/$1 break;
            proxy_pass http://backend;
        }
        try_files $uri /index.html;
    }

    # Proxy /graphql and the analytics script + event endpoint to the backend
    location ~ ^/(graphql|stats\.js|api/send) {
        proxy_pass http://backend;
    }

    # Per-character og:image card endpoint, rendered by the backend
    location ~ ^/card/ {
        proxy_pass http://backend;
    }

    # Sitemap is generated by the backend so it can include character pages
    location = /sitemap.xml {
        proxy_pass http://backend;
    }
}
