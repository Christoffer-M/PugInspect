name: Companion checks

# Proves the companion's Rust compiles and passes its tests on Windows. Bundling
# the NSIS installer is slow and proves nothing extra about the code, so it lives
# in companion-installer.yml and is run by hand when an .exe is actually wanted.
on:
  push:
    # Path filters are not evaluated for tag pushes, so without a branches
    # filter every companion-v* release tag would run this job too.
    branches: ["**"]
    paths:
      - "apps/companion/**"
      - "packages/ui/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Rust tests (decoder, parser, event shapes)
        run: cargo test --manifest-path apps/companion/src-tauri/Cargo.toml
