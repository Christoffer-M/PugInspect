name: Companion installer

# Builds the Windows NSIS installer for the desktop companion and uploads it as a
# workflow artifact (Actions tab → run → Artifacts). Unsigned: SmartScreen will
# ask for "More info → Run anyway" on first launch.
on:
  push:
    # Path filters are not evaluated for tag pushes, so without a branches
    # filter every companion-v* release tag would run this job too.
    branches: ["**"]
    paths:
      - "apps/companion/**"
      - "packages/ui/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Rust tests (decoder, parser, event shapes)
        run: cargo test --manifest-path apps/companion/src-tauri/Cargo.toml

      - name: Build installer
        # --no-sign: with an updater pubkey configured, tauri build otherwise
        # refuses to bundle without TAURI_SIGNING_PRIVATE_KEY. Signed updater
        # artifacts come from companion-release.yml only.
        run: pnpm --filter companion tauri build --no-sign

      - uses: actions/upload-artifact@v4
        with:
          name: PugInspect-Companion-windows
          path: apps/companion/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
