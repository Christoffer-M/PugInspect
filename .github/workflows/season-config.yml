name: Season config update

on:
  schedule:
    - cron: "17 6 * * *" # daily; no-op unless API data changed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # No pnpm install — the script only uses node built-ins and fetch.
      - name: Regenerate season config
        id: gen
        env:
          WARCRAFTLOGS_CLIENT_ID: ${{ secrets.WARCRAFTLOGS_CLIENT_ID }}
          WARCRAFTLOGS_CLIENT_SECRET: ${{ secrets.WARCRAFTLOGS_CLIENT_SECRET }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          set -o pipefail
          node scripts/update-season-config.mts 2>&1 | tee "$RUNNER_TEMP/season-update.log"
          {
            echo 'log<<LOG_EOF'
            cat "$RUNNER_TEMP/season-update.log"
            echo 'LOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/season-config-update
          commit-message: "chore: regenerate season config from live APIs"
          title: "chore: season config update"
          delete-branch: true
          body: |
            Automated `pnpm season:update` run detected new API data.

            Review the diff (zone matches, tier ranges, display names). At an
            expansion boundary also update `scripts/season-config.mts` by hand
            and re-run — see docs/SEASONAL_UPDATES.md.

            <details><summary>Script output (includes warnings)</summary>

            ```
            ${{ steps.gen.outputs.log }}
            ```

            </details>

      # PineGrove agent API: POST $AI_AGENT_BASE_URL/agents/<slug>/chat with
      # x-api-key auth and OpenAI-style {"messages": [...]}. The season-announcer
      # agent has GitHub and Discord access and does the rest itself: it fetches
      # the PR diff and the run logs, posts the triage comment on the PR, and
      # posts to Discord. We only send the facts of this run; its task
      # instructions live in its system prompt server-side (source of truth:
      # docs/agents/season-announcer-prompt.md). Runs only when there is
      # something to act on — a created/updated PR or a failed run — so no-op
      # cron days never ping the agent.
      - name: Notify season announcer
        if: failure() || contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          AI_AGENT_BASE_URL: ${{ secrets.AI_AGENT_BASE_URL }}
          AI_AGENT_API_KEY: ${{ secrets.AI_AGENT_API_KEY }}
          AGENT_SLUG: season-announcer # must match the agent slug in PineGrove
          JOB_STATUS: ${{ job.status }}
          PR_OP: ${{ steps.pr.outputs.pull-request-operation }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }} # fallback only, when the agent API is unreachable
        run: |
          set -o pipefail
          jq -n --arg status "$JOB_STATUS" \
                --arg op "${PR_OP:-none}" \
                --arg pr "${PR:-none}" \
                --arg pr_url "${PR_URL:-none}" \
                --arg run_url "$RUN_URL" \
                --arg repo "$REPO" \
            '{source: "GitHubActions", messages: [{role: "user", content: ("Automated season-config regeneration run finished in " + $repo + ".\n\nJob status: " + $status + "\nPR operation: " + $op + "\nPR number: " + $pr + "\nPR URL: " + $pr_url + "\nRun URL: " + $run_url)}]}' \
            > "$RUNNER_TEMP/req.json"
          curl -fsS -X POST "$AI_AGENT_BASE_URL/agents/$AGENT_SLUG/chat" \
            -H "x-api-key: $AI_AGENT_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/req.json" \
          || {
            msg=$(printf '⚠️ Season config: agent API unreachable — no triage/announcement.\nJob status: %s | PR: %s\nRun: %s' \
              "$JOB_STATUS" "${PR_URL:-none}" "$RUN_URL")
            jq -n --arg c "$msg" '{content: $c}' \
              | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"
            exit 1
          }
