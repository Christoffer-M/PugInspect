name: Season config update

on:
  schedule:
    - cron: "17 6 * * *" # daily; no-op unless API data changed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # No pnpm install — the script only uses node built-ins and fetch.
      - name: Regenerate season config
        id: gen
        env:
          WARCRAFTLOGS_CLIENT_ID: ${{ secrets.WARCRAFTLOGS_CLIENT_ID }}
          WARCRAFTLOGS_CLIENT_SECRET: ${{ secrets.WARCRAFTLOGS_CLIENT_SECRET }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          set -o pipefail
          node scripts/update-season-config.mts 2>&1 | tee "$RUNNER_TEMP/season-update.log"
          {
            echo 'log<<LOG_EOF'
            cat "$RUNNER_TEMP/season-update.log"
            echo 'LOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/season-config-update
          commit-message: "chore: regenerate season config from live APIs"
          title: "chore: season config update"
          delete-branch: true
          body: |
            Automated `pnpm season:update` run detected new API data.

            Review the diff (zone matches, tier ranges, display names). At an
            expansion boundary also update `scripts/season-config.mts` by hand
            and re-run — see docs/SEASONAL_UPDATES.md.

            <details><summary>Script output (includes warnings)</summary>

            ```
            ${{ steps.gen.outputs.log }}
            ```

            </details>

      # PineGrove agent API: POST $AI_AGENT_BASE_URL/agents/<slug>/chat with
      # x-api-key auth and OpenAI-style {"messages": [...]}. Both agents run in
      # ResponseMode=Json, so the response body is a single JSON object matching
      # the agent's JsonResponseShape — {verdict, summary} for the review agent,
      # {diagnosis} for the failure agent. Task instructions live in each
      # agent's system prompt server-side; the workflow only sends context data.
      - name: AI review triage
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        continue-on-error: true # PR already exists; triage is best-effort
        env:
          GH_TOKEN: ${{ github.token }}
          AI_AGENT_BASE_URL: ${{ secrets.AI_AGENT_BASE_URL }}
          AI_AGENT_API_KEY: ${{ secrets.AI_AGENT_API_KEY }}
          AGENT_SLUG: season-pr-triage # must match the agent slug in PineGrove
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -o pipefail
          gh pr diff "$PR" > "$RUNNER_TEMP/pr.diff"
          jq -n --rawfile log "$RUNNER_TEMP/season-update.log" \
                --rawfile cfg scripts/season-config.mts \
                --rawfile diff "$RUNNER_TEMP/pr.diff" \
            '{source: "GitHubActions", messages: [{role: "user", content: ("Triage this automated season-config PR.\n\n--- script output ---\n" + $log + "\n--- hand-maintained config (scripts/season-config.mts) ---\n" + $cfg + "\n--- diff ---\n" + $diff)}]}' \
            > "$RUNNER_TEMP/req.json"
          curl -fsS -X POST "$AI_AGENT_BASE_URL/agents/$AGENT_SLUG/chat" \
            -H "x-api-key: $AI_AGENT_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/req.json" \
            | jq -r '"VERDICT: " + .verdict + "\n\n" + .summary' > "$RUNNER_TEMP/triage.md"
          { printf '🤖 **AI triage**\n\n'; cat "$RUNNER_TEMP/triage.md"; } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"

      # The season-announcer agent owns all Discord notifications. Runs only
      # when there is something to announce — a newly created PR or a failed
      # run — so no-op cron runs (and already-open PRs) never ping the agent.
      - name: Notify season announcer
        if: failure() || steps.pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
          AI_AGENT_BASE_URL: ${{ secrets.AI_AGENT_BASE_URL }}
          AI_AGENT_API_KEY: ${{ secrets.AI_AGENT_API_KEY }}
          AGENT_SLUG: season-announcer # must match the agent slug in PineGrove
          JOB_STATUS: ${{ job.status }}
          PR_OP: ${{ steps.pr.outputs.pull-request-operation }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/season-update.log" "$RUNNER_TEMP/announce.diff" # may not exist if an early step failed
          [ -n "$PR" ] && gh pr diff "$PR" > "$RUNNER_TEMP/announce.diff" || true
          jq -n --rawfile log "$RUNNER_TEMP/season-update.log" \
                --rawfile diff "$RUNNER_TEMP/announce.diff" \
                --arg status "$JOB_STATUS" \
                --arg op "${PR_OP:-none}" \
                --arg pr_url "${PR_URL:-none}" \
                --arg run_url "$RUN_URL" \
            '{source: "GitHubActions", messages: [{role: "user", content: ("Automated season-config regeneration run finished.\n\nJob status: " + $status + "\nPR operation: " + $op + "\nPR: " + $pr_url + "\nRun: " + $run_url + "\n\n--- script output (empty means an early step failed) ---\n" + $log + "\n--- diff ---\n" + $diff)}]}' \
            > "$RUNNER_TEMP/req.json"
          curl -fsS -X POST "$AI_AGENT_BASE_URL/agents/$AGENT_SLUG/chat" \
            -H "x-api-key: $AI_AGENT_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/req.json"
