name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# Back-to-back merges must not interleave: an older run finishing last would
# push :latest and deploy a stale image over the newer one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build images and deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    env:
      # workflow_run checks out the default branch tip by default, which may be
      # newer than the commit CI just passed — build exactly the tested commit.
      SHA: ${{ github.event.workflow_run.head_sha }}
      REGISTRY: ghcr.io/christoffer-m
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are public: build context is tracked files only and .dockerignore
      # drops .env*; runtime secrets come from apps/backend/.env on the box.
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/puginspect-backend:${{ env.SHA }}
            ${{ env.REGISTRY }}/puginspect-backend:latest
          # deploy.sh prunes old images by this label, leaving other stacks alone
          labels: com.puginspect.image=true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/puginspect-frontend:${{ env.SHA }}
            ${{ env.REGISTRY }}/puginspect-frontend:latest
          labels: com.puginspect.image=true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            # Pull first so bash runs this commit's deploy.sh, not the previous one.
            git pull origin main
            TAG=${{ env.SHA }} bash deploy.sh
