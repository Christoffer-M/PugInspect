name: Companion release

# Tag `companion-vX.Y.Z` (matching the version in apps/companion/package.json)
# to build a DRAFT GitHub release with the NSIS installer, the signed updater
# artifact and latest.json. Smoke-test the draft's installer, then click
# Publish in the GitHub UI — that triggers companion-promote.yml, which copies
# latest.json to the rolling `companion-latest` release that installed apps poll.
#
# Requires the repo secret TAURI_SIGNING_PRIVATE_KEY (contents of
# ~/.tauri/puginspect-companion.key — the key has no password).
on:
  push:
    tags:
      - "companion-v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - name: Check tag matches app version
        shell: bash
        run: |
          v=$(node -p "require('./apps/companion/package.json').version")
          if [ "companion-v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/companion/package.json version $v — bump the version, delete the tag, re-tag."
            exit 1
          fi

      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          v=$(node -p "require('./apps/companion/package.json').version")
          body=$(awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' apps/companion/CHANGELOG.md)
          [ -n "$body" ] || body="See the assets below to download and install this version."
          { echo "body<<CHANGELOG_EOF"; echo "$body"; echo "CHANGELOG_EOF"; } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Rust tests (decoder, parser, event shapes)
        run: cargo test --manifest-path apps/companion/src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/companion
          tagName: ${{ github.ref_name }}
          releaseName: "PugInspect Companion v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
