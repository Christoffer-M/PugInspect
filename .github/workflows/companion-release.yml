name: Companion release

# Tag `companion-vX.Y.Z` (matching the version in apps/companion/package.json)
# to build a GitHub PRE-RELEASE with the NSIS installer, the signed updater
# artifact and latest.json.
#
# The last step promotes latest.json to the rolling `companion-latest` release,
# so every installed app picks the update up within 6 h. There is no gate
# between a green run here and users — a tag is a ship. It was a draft until
# 0.6.4; drafts are invisible to anyone without repo access, which made handing
# a build to a tester harder than it was worth.
#
# The promote runs HERE rather than in a workflow keyed on `release: published`.
# A release that tauri-action creates is authored by github-actions[bot], and
# GitHub does not start workflow runs from events made with GITHUB_TOKEN, so
# that trigger never fired once releases stopped being published by hand. It
# silently shipped nothing for 0.7.0.
#
# Requires the repo secret TAURI_SIGNING_PRIVATE_KEY (contents of
# ~/.tauri/puginspect-companion.key — the key has no password).
on:
  push:
    tags:
      - "companion-v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - name: Check tag matches app version
        shell: bash
        run: |
          v=$(node -p "require('./apps/companion/package.json').version")
          if [ "companion-v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/companion/package.json version $v — bump the version, delete the tag, re-tag."
            exit 1
          fi
          # Cargo.toml is not read for the app version, but a stale one shows up
          # in the exe's file properties and in crash output. It drifted four
          # releases before anyone noticed.
          c=$(grep -m1 '^version = ' apps/companion/src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$c" != "$v" ]; then
            echo "apps/companion/src-tauri/Cargo.toml says $c, package.json says $v — bump both."
            exit 1
          fi

      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          v=$(node -p "require('./apps/companion/package.json').version")
          body=$(awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' apps/companion/CHANGELOG.md)
          [ -n "$body" ] || body="See the assets below to download and install this version."
          { echo "body<<CHANGELOG_EOF"; echo "$body"; echo "CHANGELOG_EOF"; } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Rust tests (decoder, parser, event shapes)
        run: cargo test --manifest-path apps/companion/src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/companion
          tagName: ${{ github.ref_name }}
          releaseName: "PugInspect Companion v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true

      - name: Promote latest.json to companion-latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json --clobber
          # The updater reads the version out of this file, so a mismatch here ships
          # the wrong thing to every client. Cheap to check, expensive to miss.
          v=$(node -p "require('./apps/companion/package.json').version")
          [ "$(jq -r .version latest.json)" = "$v" ] || {
            echo "latest.json says $(jq -r .version latest.json), expected $v"; exit 1; }
          gh release view companion-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create companion-latest -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Companion updater manifest" \
              --notes "Rolling release holding latest.json for the companion auto-updater. Do not delete."
          gh release upload companion-latest latest.json -R "$GITHUB_REPOSITORY" --clobber
