name: Companion installer

# Builds the Windows NSIS installer on demand and uploads it as a workflow
# artifact (Actions tab → this workflow → run → Artifacts). Pick the branch in
# the "Run workflow" dropdown. Unsigned: SmartScreen will ask for "More info →
# Run anyway" on first launch. Signed updater artifacts come from
# companion-release.yml instead.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build installer
        # --no-sign: with an updater pubkey configured, tauri build otherwise
        # refuses to bundle without TAURI_SIGNING_PRIVATE_KEY.
        run: pnpm --filter companion tauri build --no-sign

      - uses: actions/upload-artifact@v4
        with:
          name: PugInspect-Companion-windows
          path: apps/companion/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
