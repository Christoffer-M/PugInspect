services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: puginspect
      POSTGRES_USER: puginspect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puginspect -d puginspect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - apps/backend/.env
    environment:
      PORT: "4000"
      DATABASE_URL: "postgresql://puginspect:${POSTGRES_PASSWORD:-localdev}@postgres:5432/puginspect"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch(''http://localhost:4000/graphql'',{method:''POST'',headers:{''Content-Type'':''application/json''},body:''{"query":"{__typename}"}''}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}
    environment:
      VIRTUAL_HOST: puginspect.com,www.puginspect.com
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: puginspect.com,www.puginspect.com
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - proxy

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  proxy:
    name: proxy
    external: true
