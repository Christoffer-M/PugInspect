services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - apps/backend/.env
    environment:
      PORT: "4000"
      ALLOWED_ORIGINS: "https://puginspect.com,https://www.puginspect.com"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/graphql',{method:'POST',headers:{'Content-Type':'application/json'},body:'{\"query\":\"{__typename}\"}'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
