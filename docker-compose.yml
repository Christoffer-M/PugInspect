services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - apps/backend/.env
    environment:
      PORT: "4000"
    expose:
      - "4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
