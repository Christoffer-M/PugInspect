schema {
  query: Query
}

type AltCharacter {
  avatarUrl: String
  class: String
  itemLevel: Float
  mythicPlusColor: String
  mythicPlusScore: Float
  name: String!
  raidProgression: [RaidProgressionDetail!]
  realm: String!
  region: String!
}

type BestRank {
  ilvl: Int
}

type Character {
  achievementPoints: Int
  activeSpec: String
  avatarUrl: String
  averageItemLevel: Float
  class: String
  equippedItemLevel: Float
  faction: String
  gear: Gear
  gender: String
  guild: Guild
  level: Int
  mythicPlusLogs(metric: Metric, role: RoleType): MythicPlusLogs
  name: String!
  potentialAlts: [AltCharacter!]!
  race: String
  raidLogs(byBracket: Boolean, metric: Metric, role: RoleType): RaidLogs
  raiderIo: RaiderIo
  realm: String!
  region: String!
}

type ClassCount {
  class: String!
  count: Int!
}

type DailySearchCount {
  count: Int!
  date: String!
}

enum Difficulty {
  Heroic
  LFR
  Mythic
  Normal
}

type Encounter {
  id: Int!
  name: String!
}

type Gear {
  items: [GearItem!]!
  tierSets: [TierSetSummary!]!
}

type GearItem {
  """Permanent enchant display text, null if unenchanted"""
  enchant: String
  iconUrl: String
  itemLevel: Int!
  """
  True when the slot is enchantable this season but has no permanent enchant
  """
  missingEnchant: Boolean!
  name: String!
  """POOR|COMMON|UNCOMMON|RARE|EPIC|LEGENDARY|ARTIFACT|HEIRLOOM"""
  quality: String!
  """Canonical slot token, e.g. HEAD — stable key, defines display order"""
  slot: String!
  """Localized slot name, e.g. Head"""
  slotName: String!
  sockets: [GearSocket!]!
  tierSetId: Int
  tierSetName: String
}

type GearSocket {
  """Gem display text (e.g. +176 Haste) or gem name; null when empty"""
  display: String
  filled: Boolean!
}

type Guild {
  name: String!
  realm: String!
}

enum Metric {
  dps
  hps
  points_and_damage
  points_and_healing
}

type MythicPlusClass {
  name: String!
  slug: String!
}

type MythicPlusLogs implements ZoneLogs {
  bestPerformanceAverage: Float
  dungeonRankings: [MythicPlusRanking!]
  medianPerformanceAverage: Float
  metric: Metric
}

type MythicPlusRanking {
  bestLevel: Int
  bestScore: Float
  bestThroughput: Float
  dungeon: Encounter
  lowParses: Boolean
  medianPercent: Float
  medianThroughputPercent: Float
  rankPercent: Float
  spec: String
  throughputPercent: Float
  totalRuns: Int
}

type MythicPlusRun {
  background_image_url: String!
  challange_mode_id: Int!
  class: MythicPlusClass
  completed_at: String!
  dungeon: String!
  icon_url: String!
  key_level: Int!
  keystone_upgrades: Int!
  role: String!
  short_name: String!
  spec: MythicPlusSpec
  url: String!
}

type MythicPlusSpec {
  name: String!
  slug: String!
}

type Query {
  character(byBracket: Boolean, bypassCache: Boolean, difficulty: Difficulty, metric: Metric, name: String!, partition: Int, realm: String!, region: String!, role: RoleType, zoneId: Int): Character
  characterSuggestions(region: String!, searchString: String!): [SearchResult!]!
  siteStats: SiteStats!
  zonePartitions(zoneId: Int!): [ZonePartition!]!
}

type RaidLogs implements ZoneLogs {
  bestPerformanceAverage: Float
  difficulty: Difficulty
  medianPerformanceAverage: Float
  metric: Metric
  raidRankings: [RaidRanking!]
}

type RaidProgressionDetail {
  expansion_id: Int
  heroic_bosses_killed: Int
  mythic_bosses_killed: Int
  normal_bosses_killed: Int
  raid: String!
  summary: String
  total_bosses: Int
}

type RaidRanking {
  bestAmount: Float
  bestRank: BestRank
  encounter: Encounter
  medianPercent: Float
  rankPercent: Float
  spec: String
  totalKills: Int
}

type RaiderIo {
  bestMythicPlusRuns: [MythicPlusRun!]
  currentSeason: SeasonScores
  previousSeason: SeasonScores
  raidProgression: [RaidProgressionDetail!]
  recentMythicPlusRuns: [MythicPlusRun!]
}

type RecentSearch {
  class: String
  name: String!
  realm: String!
  region: String!
  searchedAt: String!
  specialization: String
}

type RegionCount {
  count: Int!
  region: String!
}

enum RoleType {
  Any
  DPS
  Healer
  Tank
}

type SearchResult {
  name: String!
  realm: String!
  region: String!
}

type SeasonScores {
  all: Segment
  dps: Segment
  healer: Segment
  tank: Segment
}

type Segment {
  color: String!
  score: Float!
}

type SiteStats {
  classDistribution: [ClassCount!]!
  newCharactersThisWeek: Int!
  realmsTracked: Int!
  recentSearches: [RecentSearch!]!
  regionBreakdown: [RegionCount!]!
  searchesPerDay: [DailySearchCount!]!
  searchesToday: Int!
  searchesYesterday: Int!
  totalCharacters: Int!
  trendingCharacters: [TrendingCharacter!]!
}

type TierSetSummary {
  equippedCount: Int!
  id: Int!
  name: String!
}

type TrendingCharacter {
  class: String
  name: String!
  realm: String!
  region: String!
  searches: Int!
}

interface ZoneLogs {
  bestPerformanceAverage: Float
  medianPerformanceAverage: Float
  metric: Metric
}

type ZonePartition {
  compactName: String!
  id: Int!
  isDefault: Boolean!
  name: String!
}